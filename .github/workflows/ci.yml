name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies (report only)
        run: npm audit --omit=dev
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Every guardrail is load-bearing (mutants)
        run: npm run eval:mutants
      - run: npm run eval
      - name: Obfuscated injection variants (money outside the mandate must be 0)
        run: npm run eval:injection-variants
      - run: npm run build
