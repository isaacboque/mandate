# Publishes the static landing page (site/) to GitHub Pages: https://isaacboque.github.io/mandate/
# One-time setup by the repository owner: Settings > Pages > Source: "GitHub Actions". Until then the deploy step fails and nothing else is affected.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read   # deploy-pages lists the uploaded artifact through the API; without it the deploy finds 0 artifacts
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Only the files the page needs (no tests, no type stubs)
        run: |
          mkdir _site
          cp site/index.html site/status.js site/demo.mp4 site/demo.webm site/demo.gif site/poster.png _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
