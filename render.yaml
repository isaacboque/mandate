services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    # --include=dev: the build needs typescript and vite, which are devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: mock
      # The public demo searches the real Channel3 catalog; payments stay simulated. The key is NOT in this file: set CHANNEL3_API_KEY in the Render dashboard.
      # Until it is set, the demo falls back to the fixture catalog.
      - key: CATALOG
        value: channel3
      - key: CHANNEL3_API_KEY
        sync: false
      - key: TRUSTED_PROXIES
        value: "1"
      - key: NODE_VERSION
        value: "20"
      # The public demo can talk to a real model on Groq's free tier. The key is NOT in this file: set GROQ_API_KEY in the Render dashboard.
      # Until it is set, the demo runs with the offline rules agent (no model), as before.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Per-visitor limits so one visitor cannot use up the shared model quota (also the defaults whenever a model is configured).
      - key: RATE_LIMIT_ASKS_PER_HOUR
        value: "10"
      - key: DAILY_ASK_CAP
        value: "150"
